<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
<!-- Canvas Surface -->
<rect width="800" height="600" fill="#F2EFEB" />
<!-- Architectural Drafting Grid -->
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D0CCC2" stroke-width="0.75" stroke-opacity="0.5" />
</pattern>
</defs>
<rect width="800" height="600" fill="url(#grid)" />
<!-- Framing Border -->
<rect x="24" y="24" width="752" height="552" fill="none" stroke="#D0CCC2" stroke-width="1.5" />
<rect x="32" y="32" width="736" height="536" fill="none" stroke="#D0CCC2" stroke-width="0.75" />
<!-- Center Steel Profile Geometry -->
<circle cx="400" cy="270" r="90" stroke="#151618" stroke-width="2" stroke-dasharray="4 4" />
<path d="M340 330 L400 210 L460 330 Z" stroke="#9E7445" stroke-width="2" fill="none" />
<line x1="300" y1="270" x2="500" y2="270" stroke="#151618" stroke-width="1.5" />
<line x1="400" y1="170" x2="400" y2="370" stroke="#151618" stroke-width="1.5" />
<!-- Atelier Typography -->
<text x="400" y="420" font-family="Georgia, serif" font-size="24" fill="#151618" text-anchor="middle" font-weight="500" letter-spacing="1">
iron’s irony
</text>
<text x="400" y="448" font-family="monospace" font-size="11" fill="#747882" text-anchor="middle" letter-spacing="3" text-transform="uppercase">
Architectural Metalwork • Atelier Specimen
</text>
<text x="400" y="472" font-family="monospace" font-size="10" fill="#9E7445" text-anchor="middle" letter-spacing="2" text-transform="uppercase">
Photography Asset Pending Client Archive
</text>
<!-- Corner Calibration Notches -->
<path d="M24 36 H36 V24" stroke="#9E7445" stroke-width="2" fill="none" />
<path d="M776 36 H764 V24" stroke="#9E7445" stroke-width="2" fill="none" />
<path d="M24 564 H36 V576" stroke="#9E7445" stroke-width="2" fill="none" />
<path d="M776 564 H764 V576" stroke="#9E7445" stroke-width="2" fill="none" />
</svg>