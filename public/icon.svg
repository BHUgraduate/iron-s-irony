<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
<!-- Architectural Dark Iron Background -->
<rect width="64" height="64" fill="#151618" />
<!-- Subtle Architectural Grid Alignment -->
<line x1="8" y1="32" x2="56" y2="32" stroke="#26282E" stroke-width="1" stroke-dasharray="2 2" />
<line x1="32" y1="8" x2="32" y2="56" stroke="#26282E" stroke-width="1" stroke-dasharray="2 2" />
<!-- Interlocking Forged Iron Profiles -->
<!-- Left Vertical Structural Column -->
<path
d="M20 14 V50"
stroke="#F9F8F6"
stroke-width="3.5"
stroke-linecap="square"
/>
<!-- Right Structural Sweep & Arch -->
<path
d="M20 32 C 20 20, 44 20, 44 32 C 44 44, 20 44, 44 50"
stroke="#F9F8F6"
stroke-width="3"
stroke-linecap="square"
stroke-linejoin="miter"
/>
<!-- Top Pierced Cantilever Beam -->
<line x1="14" y1="18" x2="48" y2="18" stroke="#F9F8F6" stroke-width="2" />
<!-- Forged Bronze Tenon Rivet / Accent Landmark -->
<rect x="29.5" y="29.5" width="5" height="5" fill="#9E7445" />
<!-- Corner Hairline Register Brackets -->
<path d="M4 8 H8 V4" stroke="#9E7445" stroke-width="1.5" fill="none" />
<path d="M60 8 H56 V4" stroke="#9E7445" stroke-width="1.5" fill="none" />
<path d="M4 56 H8 V60" stroke="#9E7445" stroke-width="1.5" fill="none" />
<path d="M60 56 H56 V60" stroke="#9E7445" stroke-width="1.5" fill="none" />
</svg>