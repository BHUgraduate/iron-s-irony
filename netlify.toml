# Netlify detects Next.js and installs its official runtime automatically; no plugin entry is needed.
[build]
  command = "npm run check:content && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Public, not a secret. Used for canonical URLs, sitemap, robots and social previews.
  NEXT_PUBLIC_SITE_URL = "https://ironsirony.hycyon.com"
